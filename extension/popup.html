<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkedIn File Preview</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="container">
      <h1>LinkedIn Preview</h1>
      <p class="hint">Drop a CSV/Excel file or choose one from your folders.</p>

      <label id="dropzone" class="dropzone" for="fileInput">
        <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" />
        <span>Drop file here or click to select</span>
      </label>

      <p id="status" class="status">No file selected.</p>
      <div class="controls">
        <span class="toggle-label">Batch mode</span>
        <label class="switch" for="modeToggle" aria-label="Batch mode toggle">
          <input id="modeToggle" type="checkbox" checked />
          <span class="slider"></span>
        </label>
        <button id="startBtn" disabled>Start Processing</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="downloadBtn" disabled>Download CSV</button>
      </div>
      <div class="progress-wrap">
        <div id="progressText" class="progress-text">Done: 0 | Pending: 0 | Total: 0</div>
        <progress id="progressBar" value="0" max="1"></progress>
      </div>

      <div class="table-wrap">
        <table id="previewTable">
          <thead>
            <tr>
              <th>Full Name</th>
              <th>LinkedIn</th>
              <th>Mails</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </main>

    <script src="vendor/xlsx.full.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
